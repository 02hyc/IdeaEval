version: 1
harness: claude
model: claude-opus-4-6
effort: max
workspace:
  root: .runs
  run_id: null
  agent_dir: agent_workspace
  clean_existing: false
assets:
  root: src/research_ideation_agent/assets
  version: scientific-hypothesis-generator
mcp:
  profile: scholar-gateway
  scholar_gateway:
    command: scholar-gateway-mcp
    cutoff_date: null
    restrict_domains: true
    strict_filtering: true
    mode: rules
    format: markdown
    references_dir: references
    required_env_vars:
    - WTS_API_KEY
    optional_env_vars:
    - WTS_BASE_URL
    - DEEPSEEK_BASE_URL
    - DEEPSEEK_API_KEY
    - DEEPSEEK_MODEL
    startup_timeout_seconds: 60
    tool_timeout_seconds: 600
    approval_mode: approve
permissions:
  approval_policy: auto
budgets:
  timeout_seconds: 5400
  max_turns: 1500  # runaway-loop backstop; timeout_seconds is the primary bound
  max_cost_usd: null
pricing:
  # Official standard API token prices checked on 2026-06-19.
  # Values are USD per 1M tokens; batch discounts, fast-mode premiums,
  # regional multipliers, and gateway-specific markups are not applied here.
  models:
    claude-opus-4-6:
      # Claude Opus 4.6 standard pricing; 5-minute cache-write price.
      input_per_million_usd: 5.0
      cached_input_per_million_usd: 0.5
      cache_creation_input_per_million_usd: 6.25
      output_per_million_usd: 25.0
      reasoning_output_per_million_usd: 25.0
      input_includes_cached_tokens: false
    global.anthropic.claude-opus-4-6-v1:
      # Same model under its Bedrock global inference-profile id (used in the released runs).
      input_per_million_usd: 5.0
      cached_input_per_million_usd: 0.5
      cache_creation_input_per_million_usd: 6.25
      output_per_million_usd: 25.0
      reasoning_output_per_million_usd: 25.0
      input_includes_cached_tokens: false
    Pro/moonshotai/Kimi-K2.6:
      input_per_million_usd: 0.95
      cached_input_per_million_usd: 0.16
      output_per_million_usd: 4.0
      reasoning_output_per_million_usd: 4.0
      input_includes_cached_tokens: false
    zai-org/GLM-5.2:
      input_per_million_usd: 1.4
      cached_input_per_million_usd: 0.26
      output_per_million_usd: 4.4
      reasoning_output_per_million_usd: 4.4
      input_includes_cached_tokens: false
    deepseek-ai/DeepSeek-V4-Pro:
      input_per_million_usd: 0.435
      cached_input_per_million_usd: 0.003625
      output_per_million_usd: 0.87
      reasoning_output_per_million_usd: 0.87
      input_includes_cached_tokens: false
    gpt-5.5:
      input_per_million_usd: 5.0
      cached_input_per_million_usd: 0.5
      output_per_million_usd: 30.0
      reasoning_output_per_million_usd: 30.0
      input_includes_cached_tokens: true
      long_context_threshold_tokens: 272000
      long_context_input_per_million_usd: 10.0
      long_context_cached_input_per_million_usd: 1.0
      long_context_output_per_million_usd: 45.0
      long_context_reasoning_output_per_million_usd: 45.0
    gpt-5.4:
      input_per_million_usd: 2.5
      cached_input_per_million_usd: 0.25
      output_per_million_usd: 15.0
      reasoning_output_per_million_usd: 15.0
      input_includes_cached_tokens: true
      long_context_threshold_tokens: 272000
      long_context_input_per_million_usd: 5.0
      long_context_cached_input_per_million_usd: 0.5
      long_context_output_per_million_usd: 22.5
      long_context_reasoning_output_per_million_usd: 22.5
repair:
  strategy: external-loop
  max_attempts: 1
skills:
  selected:
  - literature-review
  - hypothesis-method
  - proposal-writeup
subagents:
  selected:
  - scientific-reviewer
hooks:
  stop:
  - script: hooks/stop_artifact_gate.py
    timeout: 30
logging:
  write_run_record: true
  retain_event_log: true
adapters:
  claude:
    strict_mcp_config: true
    api_key_env: ANTHROPIC_API_KEY
    base_url_env: ANTHROPIC_BASE_URL
    disallowed_tools:
    - AskUserQuestion
    - PushNotification
    - WebFetch
    - WebSearch
