[project]
name = "research-ideation-agent"
version = "0.1.0"
description = "Autonomous AI research ideation agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "claude-agent-sdk>=0.2.91",
    "openai-codex>=0.1.0b2",
    "openai-codex-cli-bin==0.137.0a4 ; sys_platform == 'linux'",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "fastmcp>=2.0.0",
    "httpx>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "anyio[trio]>=4.0",
    "pytest-httpx>=0.34.0",
    "pytest-anyio>=0.0.0",
]

[project.scripts]
research-ideation-agent = "research_ideation_agent.cli:main"
viz = "research_ideation_agent.log_viewer.cli:main"
scholar-gateway-mcp = "research_ideation_agent.scholar_gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_ideation_agent"]

[tool.hatch.build.targets.wheel.force-include]
"src/research_ideation_agent/log_viewer/static" = "research_ideation_agent/log_viewer/static"
"src/research_ideation_agent/assets" = "research_ideation_agent/assets"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
