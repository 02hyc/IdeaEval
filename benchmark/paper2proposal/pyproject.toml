[project]
name = "paper2proposal"
version = "0.1.0"
description = "Convert academic papers to structured research proposals via single LLM call"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "pyyaml>=6.0",
]

[project.scripts]
paper2proposal = "paper2proposal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/paper2proposal"]
artifacts = ["src/paper2proposal/default_config.yaml", "src/paper2proposal/prompts/*.md"]

[tool.ruff]
target-version = "py311"
line-length = 120
