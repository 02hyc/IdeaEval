[project]
name = "ideaeval-evaluator"
version = "0.1.0"
description = "IdeaEval pairwise proposal ranker (literature review, analysis, and judge agents)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.12",
    "loguru>=0.7",
    "PyYAML>=6.0",
    "anthropic[bedrock]",
    "psutil>=7.0",
    "pexpect>=4.9",
    "pyte>=0.8",
    "pytz",
    "tenacity",
    "Pillow",
    "requests",
    "PyPDF2",
    "aiohttp",
    "python-dotenv",
    "openai",
    "tiktoken",
    "filelock",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
